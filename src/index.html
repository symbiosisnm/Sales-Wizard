<!doctype html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
        <title>Screen and Audio Capture</title>
        <style>
            :root {
                --background-transparent: transparent;
                --text-color: #f4f5f8;
                --border-color: rgba(255, 255, 255, 0.18);
                --glass-border: rgba(255, 255, 255, 0.18);
                --glass-border-strong: rgba(255, 255, 255, 0.32);
                --glass-edge-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.35);
                --glass-shadow: 0 24px 48px rgba(8, 12, 24, 0.45);
                --glass-shadow-soft: 0 16px 40px rgba(8, 12, 24, 0.35);
                --glass-panel-shadow: -12px 0 28px rgba(8, 12, 24, 0.35);
                --glass-backdrop-filter: blur(26px) saturate(160%);
                --glass-backdrop-filter-strong: blur(30px) saturate(180%);
                --header-background: linear-gradient(135deg, rgba(28, 38, 60, 0.72), rgba(12, 18, 28, 0.5));
                --header-actions-color: rgba(255, 255, 255, 0.76);
                --main-content-background: linear-gradient(135deg, rgba(16, 24, 40, 0.66), rgba(34, 48, 68, 0.38));
                --panel-background: linear-gradient(140deg, rgba(16, 26, 44, 0.68), rgba(24, 34, 54, 0.4));
                --panel-surface-background: rgba(255, 255, 255, 0.05);
                --panel-footer-background: rgba(255, 255, 255, 0.07);
                --panel-input-background: rgba(8, 14, 26, 0.48);
                --response-background: linear-gradient(145deg, rgba(12, 20, 34, 0.6), rgba(32, 44, 64, 0.38));
                --glass-quote-background: rgba(255, 255, 255, 0.1);
                --button-background: linear-gradient(140deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06));
                --button-border: rgba(255, 255, 255, 0.2);
                --icon-button-color: #f6f7f9;
                --hover-background: rgba(255, 255, 255, 0.2);
                --input-background: rgba(10, 16, 28, 0.38);
                --placeholder-color: rgba(255, 255, 255, 0.55);
                --focus-border-color: #0a84ff;
                --focus-box-shadow: rgba(10, 132, 255, 0.25);
                --input-focus-background: rgba(10, 16, 28, 0.58);
                --scrollbar-track: rgba(255, 255, 255, 0.08);
                --scrollbar-thumb: rgba(255, 255, 255, 0.28);
                --scrollbar-thumb-hover: rgba(255, 255, 255, 0.42);
                --preview-video-background: rgba(8, 12, 20, 0.92);
                --preview-video-border: rgba(255, 255, 255, 0.16);
                --option-label-color: rgba(255, 255, 255, 0.82);
                --screen-option-background: rgba(12, 18, 30, 0.45);
                --screen-option-hover-background: rgba(12, 18, 30, 0.68);
                --screen-option-selected-background: rgba(10, 132, 255, 0.2);
                --screen-option-text: rgba(255, 255, 255, 0.75);
                --description-color: rgba(255, 255, 255, 0.65);
                --start-button-background: rgba(255, 255, 255, 0.9);
                --start-button-color: rgba(10, 16, 28, 0.9);
                --start-button-border: rgba(255, 255, 255, 0.7);
                --start-button-hover-background: rgba(255, 255, 255, 0.78);
                --start-button-hover-border: rgba(0, 0, 0, 0.2);
                --text-input-button-background: #0a84ff;
                --text-input-button-hover: #0060df;
                --link-color: #0a84ff;
                --key-background: rgba(255, 255, 255, 0.16);
                --scrollbar-background: rgba(12, 18, 30, 0.45);
                --side-panel-width: 320px;
                --side-panel-max-width: 360px;

                /* Layout-specific variables */
                --header-padding: 10px 20px;
                --header-font-size: 16px;
                --header-gap: 12px;
                --header-button-padding: 8px 16px;
                --header-icon-padding: 8px;
                --header-font-size-small: 13px;
                --main-content-padding: 20px;
                --main-content-margin-top: 10px;
                --icon-size: 24px;
                --border-radius: 10px;
                --content-border-radius: 10px;
            }

            /* Compact layout styles */
            :root.compact-layout {
                --header-padding: 6px 12px;
                --header-font-size: 13px;
                --header-gap: 6px;
                --header-button-padding: 4px 8px;
                --header-icon-padding: 4px;
                --header-font-size-small: 10px;
                --main-content-padding: 10px;
                --main-content-margin-top: 2px;
                --icon-size: 16px;
                --border-radius: 4px;
                --content-border-radius: 4px;
                --side-panel-width: 280px;
                --side-panel-max-width: 320px;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                font-family:
                    'Inter',
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            sales-wizard-app {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="utils/logger.js"></script>
        <script type="module" src="components/app/SalesWizardApp.js"></script>

        <sales-wizard-app id="salesWizard"></sales-wizard-app>
        <script src="script.js"></script>
        <script src="utils/renderer.js"></script>
    </body>
</html>
