<!doctype html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
        <title>Screen and Audio Capture</title>
        <style>
            :root {
                --background-transparent: transparent;
                --text-color: #eef4ff;
                --border-color: rgba(255, 255, 255, 0.14);
                --header-background: rgba(10, 18, 30, 0.26);
                --header-actions-color: rgba(255, 255, 255, 0.6);
                --main-content-background: rgba(10, 18, 30, 0.22);
                --button-background: rgba(255, 255, 255, 0.06);
                --button-border: rgba(255, 255, 255, 0.12);
                --icon-button-color: rgb(229, 229, 231);
                --hover-background: rgba(255, 255, 255, 0.12);
                --input-background: rgba(255, 255, 255, 0.05);
                --placeholder-color: rgba(255, 255, 255, 0.42);
                --focus-border-color: #7dd3fc;
                --focus-box-shadow: rgba(125, 211, 252, 0.18);
                --input-focus-background: rgba(255, 255, 255, 0.08);
                --scrollbar-track: rgba(255, 255, 255, 0.04);
                --scrollbar-thumb: rgba(255, 255, 255, 0.18);
                --scrollbar-thumb-hover: rgba(255, 255, 255, 0.28);
                --preview-video-background: rgba(0, 0, 0, 0.9);
                --preview-video-border: rgba(255, 255, 255, 0.15);
                --option-label-color: rgba(255, 255, 255, 0.82);
                --screen-option-background: rgba(255, 255, 255, 0.06);
                --screen-option-hover-background: rgba(255, 255, 255, 0.1);
                --screen-option-selected-background: rgba(125, 211, 252, 0.16);
                --screen-option-text: rgba(255, 255, 255, 0.7);
                --description-color: rgba(255, 255, 255, 0.6);
                --start-button-background: rgba(240, 249, 255, 0.92);
                --start-button-color: #04111f;
                --start-button-border: rgba(255, 255, 255, 0.64);
                --start-button-hover-background: rgba(240, 249, 255, 0.82);
                --start-button-hover-border: rgba(0, 0, 0, 0.2);
                --text-input-button-background: rgba(56, 189, 248, 0.9);
                --text-input-button-hover: rgba(14, 165, 233, 0.92);
                --link-color: #7dd3fc;
                --key-background: rgba(255, 255, 255, 0.12);
                --scrollbar-background: rgba(255, 255, 255, 0.06);

                /* Layout-specific variables */
                --header-padding: 10px 20px;
                --header-font-size: 16px;
                --header-gap: 12px;
                --header-button-padding: 8px 16px;
                --header-icon-padding: 8px;
                --header-font-size-small: 13px;
                --main-content-padding: 20px;
                --main-content-margin-top: 10px;
                --icon-size: 24px;
                --border-radius: 10px;
                --content-border-radius: 10px;
            }

            /* Compact layout styles */
            :root.compact-layout {
                --header-padding: 6px 12px;
                --header-font-size: 13px;
                --header-gap: 6px;
                --header-button-padding: 4px 8px;
                --header-icon-padding: 4px;
                --header-font-size-small: 10px;
                --main-content-padding: 10px;
                --main-content-margin-top: 2px;
                --icon-size: 16px;
                --border-radius: 4px;
                --content-border-radius: 4px;
            }

            :root.side-dock-layout {
                --header-padding: 8px 10px;
                --header-font-size: 13px;
                --header-gap: 6px;
                --header-button-padding: 5px 8px;
                --header-icon-padding: 5px;
                --header-font-size-small: 10px;
                --main-content-padding: 8px;
                --main-content-margin-top: 4px;
                --icon-size: 18px;
                --border-radius: 18px;
                --content-border-radius: 18px;
            }

            :root.glass-frame-layout {
                --header-padding: 8px 10px;
                --header-font-size: 13px;
                --header-gap: 6px;
                --header-button-padding: 5px 8px;
                --header-icon-padding: 5px;
                --header-font-size-small: 10px;
                --main-content-padding: 0;
                --main-content-margin-top: 0;
                --icon-size: 18px;
                --border-radius: 999px;
                --content-border-radius: 0;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                font-family:
                    'Inter',
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            sales-wizard-app {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="utils/logger.js"></script>
        <script type="module" src="components/app/SalesWizardApp.js"></script>

        <sales-wizard-app id="salesWizard"></sales-wizard-app>
    </body>
</html>
